#:schema https://brimble.io/schema/brimble.json

# The Astro site runs as a Node web service so the share-image and Spotify
# routes work. Builds run from the repo root because studio/ and web/ are bun
# workspaces that share one lockfile; the server itself runs on Node.

[services.web]
type = "web"

[services.web.build]
install = "bun install --frozen-lockfile"
command = "bun run build"
runtime = { node = "24" }
cache = true

[services.web.deploy]
start = "npm start"
health = "/"

[services.web.env]
NODE_ENV = "production"
# The Node adapter binds to localhost unless told otherwise; Brimble needs 0.0.0.0.
HOST = "0.0.0.0"
PUBLIC_SANITY_PROJECT_ID = "1dyyk69c"
PUBLIC_SANITY_DATASET = "production"
PUBLIC_SITE_URL = "https://feranmiadedokun.com"
PUBLIC_GA_MEASUREMENT_ID = "G-KLRE9PW7VY"
PUBLIC_BRIMBLE_WEBSITE_ID = "8a4301ff-04b9-43ce-9fb6-f650b18ab470"
PUBLIC_QUALITY_SITE_ID = "qs_live_6a7a03fee14714322d6e98ae"
