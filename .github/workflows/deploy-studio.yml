name: Deploy Sanity Studio

on:
  push:
    branches: [main]
    paths:
      - 'studio/**'
      - 'bun.lock'
      - '.github/workflows/deploy-studio.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-studio
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Studio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Deploy Sanity Studio
        run: bun run --cwd studio deploy
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
          SANITY_STUDIO_PROJECT_ID: ${{ vars.SANITY_STUDIO_PROJECT_ID }}
          SANITY_STUDIO_DATASET: ${{ vars.SANITY_STUDIO_DATASET }}
          SANITY_STUDIO_STUDIO_HOST: ${{ vars.SANITY_STUDIO_STUDIO_HOST }}
